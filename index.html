<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Marker Hub</title>
<link rel="icon" href="flag-game.png">
<style>
:root{--bg:#fafaf8;--card:#fff;--tx:#18181b;--mut:#8a8a93;--ac:#18181b;--act:#fff;--bd:#ececea;--sh:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(0,0,0,.05);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root{--bg:#0e0e10;--card:#18181b;--tx:#f4f4f5;--mut:#85858f;--ac:#f4f4f5;--act:#0e0e10;--bd:#27272b;--sh:none}}
html{color-scheme:light dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif}
#app{max-width:560px;margin:0 auto;padding:18px;display:flex;flex-direction:column;gap:14px}
header{text-align:center;padding-top:18px;animation:pop .5s backwards}
.brand{font-size:40px;font-weight:800;letter-spacing:-.02em;margin:8px 0 2px;background:linear-gradient(90deg,#4f7cff,#b05cff,#ff5c9d,#4f7cff);background-size:200% auto;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite}
.s{color:var(--mut);margin:0;font-size:15px;text-align:center}
button,a.play{font:inherit;color:var(--tx);border:1px solid var(--bd);background:var(--card);border-radius:18px;padding:14px 18px;cursor:pointer;box-shadow:var(--sh);text-decoration:none;text-align:center;transition:transform .12s}
button:active,a.play:active{transform:scale(.97)}
.big{background:var(--ac);color:var(--act);border:0;font-weight:600;font-size:16px}
a.play{background:var(--ac);color:var(--act);border:0;font-weight:600;align-self:center;white-space:nowrap}
.ic{padding:6px 10px;border-radius:12px;box-shadow:none}
.seg{display:flex;gap:2px;background:var(--bd);border-radius:14px;padding:3px;flex-wrap:wrap}
.seg button{flex:1 1 30%;border:0;box-shadow:none;background:transparent;padding:10px 4px;border-radius:11px;font-size:14px}
.seg button.on{background:var(--card);box-shadow:var(--sh);font-weight:600}
.lang{display:flex;justify-content:center;gap:6px;margin-top:10px}.lang button{padding:4px 10px;font-size:13px;border-radius:10px;box-shadow:none}.lang button.on{background:var(--ac);color:var(--act)}
.grid{display:grid;gap:12px}
.card{display:flex;gap:14px;align-items:center;padding:16px;background:var(--card);border:1px solid var(--bd);border-radius:22px;box-shadow:var(--sh);animation:pop .4s backwards}
.card p{margin:2px 0 0}.card b{font-size:18px}
.em{font-size:38px;width:62px;height:62px;border-radius:18px;background:var(--bd);display:flex;align-items:center;justify-content:center;flex:none}
.em img{width:100%;height:100%;object-fit:cover;border-radius:18px}
.bd{flex:1;min-width:0}.bd p{color:var(--mut);font-size:14px}.bd small{color:var(--mut);display:block;margin-top:4px}
input,select{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;width:100%}
.form{display:grid;gap:10px}
.row{display:flex;gap:8px;align-items:center;padding:10px 14px;background:var(--card);border:1px solid var(--bd);border-radius:14px}.row b{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
footer{text-align:center;color:var(--mut);font-size:13px;padding:18px 0}
footer a{color:var(--mut);cursor:pointer;text-decoration:none}
@keyframes pop{from{opacity:0;transform:scale(.94) translateY(6px)}to{opacity:1;transform:none}}
@keyframes shine{to{background-position:200% center}}
.grid>.card:nth-child(2){animation-delay:.06s}.grid>.card:nth-child(3){animation-delay:.12s}.grid>.card:nth-child(n+4){animation-delay:.18s}
#splash{position:fixed;inset:0;background:#000;z-index:100;display:flex;align-items:center;justify-content:center;transition:opacity .9s}
#splash.out{opacity:0;pointer-events:none}
.sp{position:absolute;display:flex;flex-direction:column;align-items:center;gap:22px;opacity:0;color:#fff}
.sp1{animation:spA 3.3s ease-in-out .3s forwards}.sp2{animation:spB 1.4s ease 3.6s forwards}
@keyframes spA{0%{opacity:0;transform:scale(.94)}25%,75%{opacity:1;transform:none}100%{opacity:0;transform:scale(1.04)}}
@keyframes spB{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.lg{filter:drop-shadow(0 0 14px rgba(130,110,255,.55))}
.lg .m{stroke-dasharray:200;stroke-dashoffset:200;animation:dr 1.5s ease .6s forwards}
.lg .rg{stroke-dasharray:340;stroke-dashoffset:340;animation:dr 1.9s ease .4s forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.st{font-size:20px;font-weight:700;letter-spacing:.4em;padding-left:.4em;opacity:0;animation:stI 1.3s ease 1.7s forwards}
@keyframes stI{from{opacity:0;letter-spacing:.9em;filter:blur(6px)}to{opacity:1;letter-spacing:.4em;filter:none}}
.tt{font-size:54px;font-weight:800;letter-spacing:-.02em;opacity:0;background:linear-gradient(90deg,#4f7cff,#b05cff,#ff5c9d);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(176,92,255,.45));animation:ttI 1.3s ease 3.9s forwards}
@keyframes ttI{from{opacity:0;transform:translateY(14px);filter:blur(8px)}to{opacity:1;transform:none;filter:drop-shadow(0 0 18px rgba(176,92,255,.45))}}
.fl{font-size:22px;letter-spacing:.35em;padding-left:.35em;opacity:0;animation:fl 1s ease 4.7s forwards}
@keyframes fl{to{opacity:.9}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}#splash{display:none}}
</style></head><body><div id="app"></div>
<div id="splash"><div class="sp sp1"><svg class="lg" viewBox="0 0 120 120" width="120" height="120" fill="none"><defs><linearGradient id="sg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset=".55" stop-color="#b05cff"/><stop offset="1" stop-color="#ff5c9d"/></linearGradient></defs><circle class="rg" cx="60" cy="60" r="54" stroke="url(#sg)" stroke-opacity=".5" stroke-width="2"/><path class="m" d="M30 86V34L60 66L90 34V86" stroke="url(#sg)" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="st">MARKER TEAM</div></div>
<div class="sp sp2"><div class="tt">Marker Hub</div><div class="fl">🎮 🕹️ 🏳️</div></div></div>
<script>
const FIREBASE_CONFIG={apiKey:"AIzaSyDjs8l6hbh4pftXKvipO_TEyg4sXVP7njo",authDomain:"flag-game-marker.firebaseapp.com",projectId:"flag-game-marker",storageBucket:"flag-game-marker.firebasestorage.app",messagingSenderId:"255079278063",appId:"1:255079278063:web:50cf38d21b6236a996821a"};
const OWNER_EMAIL="markghambaryan59@gmail.com";
const CONTACTS=[{label:"✉️ markghambaryan59@gmail.com",url:"mailto:markghambaryan59@gmail.com?subject=Marker%20Hub%3A%20new%20game"}]; // можно добавить ещё, например: {label:"Telegram",url:"https://t.me/ник"}
const I={
ru:{tag:"Игры от Marker Team и друзей",mine:"Игры Marker Team",com:"Игры сообщества",sub:"Прислать игру",play:"Играть",none:"Пока здесь пусто",by:"Автор",subTxt:"Сделал свою игру? Свяжись со мной и пришли её: я проверю и добавлю на Hub.",noC:"Контакты скоро появятся."},
en:{tag:"Games by Marker Team and friends",mine:"Marker Team games",com:"Community games",sub:"Submit a game",play:"Play",none:"Nothing here yet",by:"By",subTxt:"Made your own game? Contact me and send it over: I'll review it and add it to the Hub.",noC:"Contacts are coming soon."},
hy:{tag:"Marker Team-ի և ընկերների խաղեր",mine:"Marker Team խաղեր",com:"Համայնքի խաղեր",sub:"Ուղարկել խաղ",play:"Խաղալ",none:"Դեռ դատարկ է",by:"Հեղինակ",subTxt:"Սարքե՞լ ես քո խաղը։ Կապ հաստատիր ինձ հետ և ուղարկիր այն. ես կստուգեմ և կավելացնեմ Hub-ում։",noC:"Կոնտակտները շուտով կհայտնվեն։"}};
const BUILTIN=[{id:"flag-game",section:"mine",emoji:"🏳️",icon:"flag-game.png",title:"Flag Game",url:"flag-game.html",desc:{ru:"Угадывай флаги стран: 3 уровня сложности, рубины, магазин и рейтинг.",en:"Guess country flags: 3 difficulty levels, rubies, a shop and a leaderboard.",hy:"Գուշակիր երկրների դրոշները՝ 3 մակարդակ, ռուբիններ, խանութ և վարկանիշ։"}}];
const $=document.getElementById("app");
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const okImg=u=>!u||/^(https?:\/\/[^\s"'<>]+|[\w\-\/]+\.(png|jpe?g|webp|svg|gif))$/i.test(u);
const okUrl=u=>/^(https?:\/\/[^\s"'<>]+|[\w\-\/]+\.html)$/.test(u);
let lang="ru";try{lang=localStorage.getItem("hublang")||((navigator.language||"ru").slice(0,2))}catch(e){}if(!I[lang])lang="ru";
const t=()=>I[lang];
let tab="mine",F=null,user=null,games=[],initErr="",fbBusy=true;
const isAdmin=()=>!!(user&&user.email===OWNER_EMAIL);
function toast(m){const d=document.createElement("div");d.textContent=m;d.style.cssText="position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ac);color:var(--act);padding:10px 18px;border-radius:999px;font-weight:600;z-index:50";document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
function card(g){const d=typeof g.desc==="object"?(g.desc[lang]||g.desc.en):g.desc,ext=/^https?:/.test(g.url);
return `<div class="card"><div class="em">${g.icon&&okImg(g.icon)?`<img src="${esc(g.icon)}" alt="" loading="lazy" onerror="this.replaceWith(document.createTextNode('🎮'))">`:esc(g.emoji||"🎮")}</div><div class="bd"><b>${esc(g.title)}</b><p>${esc(d)}</p>${g.author?`<small>${t().by}: ${esc(g.author)}</small>`:""}${g.hidden?"<small>скрыто</small>":""}</div>${okUrl(g.url)?`<a class="play" href="${esc(g.url)}"${ext?' target="_blank" rel="noopener"':""}>${t().play}</a>`:""}</div>`}
function adminHtml(){
if(!F)return fbBusy?'<p class="s">Подключение к Firebase…</p>':`<p class="s">Firebase не подключён: ${esc(initErr)}</p><button onclick="retryFb()">Повторить</button>`;
if(!user)return '<button class="big" onclick="signIn()">Войти через Google</button>';
if(!isAdmin())return `<p class="s">Нет прав администратора (${esc(user.email)})</p><button onclick="signOut()">Выйти</button>`;
return `<div class="form"><b>Добавить игру</b><input id="a_t" placeholder="Название" maxlength="60"><input id="a_d" placeholder="Описание" maxlength="200"><input id="a_u" placeholder="Ссылка: flag-game.html или https://..."><input id="a_e" placeholder="Эмодзи, например 🎮" maxlength="4"><input id="a_i" placeholder="Иконка: snake.png или https://... (необязательно)"><select id="a_s"><option value="mine">Игры Marker Team</option><option value="community">Игры сообщества</option></select><input id="a_a" placeholder="Автор (для чужих игр)" maxlength="40"><button class="big" onclick="addGame()">Добавить</button></div>
<b>Управление</b>${games.map(g=>`<div class="row"><b>${esc(g.title)}${g.hidden?" 🙈":""}</b><button class="ic" onclick="toggleG('${g.id}')">${g.hidden?"👁":"🙈"}</button><button class="ic" onclick="delG('${g.id}')">🗑</button></div>`).join("")||'<p class="s">Пусто</p>'}<button onclick="signOut()">Выйти</button>`}
function view(){
const L=t(),all=[...BUILTIN,...games].filter(g=>isAdmin()||!g.hidden);
const tabs=[["mine",L.mine],["com",L.com],["sub",L.sub]];if(tab==="admin")tabs.push(["admin","⚙️"]);
let body;
if(tab==="mine"||tab==="com"){const sec=tab==="mine"?"mine":"community",l=all.filter(g=>(g.section||"mine")===sec);body=l.length?`<div class="grid">${l.map(card).join("")}</div>`:`<p class="s">${L.none}</p>`}
else if(tab==="sub")body=`<div class="card" style="flex-direction:column;align-items:stretch"><p style="color:var(--tx);font-size:16px">${L.subTxt}</p>${CONTACTS.length?CONTACTS.map(c=>`<a class="play" href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.label)}</a>`).join(""):`<p class="s">${L.noC}</p>`}</div>`;
else body=adminHtml();
$.innerHTML=`<header><svg viewBox="0 0 120 120" width="54" height="54" fill="none"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4f7cff"/><stop offset=".55" stop-color="#b05cff"/><stop offset="1" stop-color="#ff5c9d"/></linearGradient></defs><circle cx="60" cy="60" r="54" stroke="url(#g2)" stroke-opacity=".5" stroke-width="3"/><path d="M30 86V34L60 66L90 34V86" stroke="url(#g2)" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="brand">Marker Hub</div><p class="s">${L.tag}</p>
<div class="lang">${["ru","en","hy"].map(k=>`<button class="${k==lang?"on":""}" onclick="setLang('${k}')">${k.toUpperCase()}</button>`).join("")}</div></header>
<div class="seg">${tabs.map(([k,l])=>`<button class="${k==tab?"on":""}" onclick="go('${k}')">${l}</button>`).join("")}</div>${body}
<footer>© Marker Team · <a onclick="go('admin')">admin</a></footer>`}
function go(k){tab=k;view()}
function setLang(k){lang=k;try{localStorage.setItem("hublang",k)}catch(e){}view()}
async function load(){if(!F)return;try{const s=await F.fs.getDocs(F.fs.collection(F.store,"hub_games"));games=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.created||0)-(b.created||0))}catch(e){games=[]}view()}
async function initFb(){try{const B="https://www.gstatic.com/firebasejs/10.12.2/";const[a,au,fs]=await Promise.all([import(B+"firebase-app.js"),import(B+"firebase-auth.js"),import(B+"firebase-firestore.js")]);const app=a.initializeApp(FIREBASE_CONFIG),auth=au.getAuth(app),store=fs.getFirestore(app);F={au,fs,auth,store};au.onAuthStateChanged(auth,u=>{user=u;view()});fbBusy=false;load()}catch(e){F=null;initErr=String(e&&e.message||e);fbBusy=false;view()}}
function retryFb(){fbBusy=true;view();initFb()}
function signIn(){F.au.signInWithPopup(F.auth,new F.au.GoogleAuthProvider()).catch(e=>toast(e.code||"error"))}
function signOut(){F.au.signOut(F.auth)}
async function addGame(){const v=id=>document.getElementById(id).value.trim(),ti=v("a_t"),u=v("a_u");if(!ti||!okUrl(u)||!okImg(v("a_i"))){toast("Проверь название, ссылку и иконку");return}
try{await F.fs.addDoc(F.fs.collection(F.store,"hub_games"),{title:ti.slice(0,60),desc:v("a_d").slice(0,200),url:u,emoji:v("a_e")||"🎮",icon:v("a_i"),section:v("a_s"),author:v("a_a").slice(0,40),hidden:false,created:Date.now()});toast("Добавлено");load()}catch(e){toast("Ошибка: "+(e.code||e.message))}}
async function toggleG(id){const g=games.find(x=>x.id===id);try{await F.fs.updateDoc(F.fs.doc(F.store,"hub_games",id),{hidden:!g.hidden});load()}catch(e){toast("Ошибка")}}
async function delG(id){if(!confirm("Удалить игру?"))return;try{await F.fs.deleteDoc(F.fs.doc(F.store,"hub_games",id));load()}catch(e){toast("Ошибка")}}
(()=>{const sp=document.getElementById("splash");let seen=false;try{seen=sessionStorage.getItem("hubsplash")==="1";sessionStorage.setItem("hubsplash","1")}catch(e){}
if(seen){sp.remove();return}let d=false;const end=()=>{if(d)return;d=true;sp.classList.add("out");setTimeout(()=>sp.remove(),900)};sp.addEventListener("click",end);setTimeout(end,6600)})();
view();initFb();
</script></body></html>
