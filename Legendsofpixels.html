pause(){if(!g||g.paused)return;g.paused=1;ctl.style.display='none';hh(`<div class=ttl style='font-size:8cqh'>ПАУЗА</div><div class=col><button class='pb g' data-a=resume>Продолжить</button><button class='pb r' data-a=quit>В меню</button></div>`)},
resume(){hm.style.display='none';g.paused=0;showctl(1);last=performance.now()},
quit(){g=null;keys={};IN.mx=IN.my=0;showctl(0);music(3);act.home()},
camp(){mm('<h1>Кампания</h1><div class=gr>'+C.map((l,i)=>`<button class="pb ${i<S.camp?'g':''}" data-a=chap data-k=${i} ${i>S.camp?'disabled':''}>${i+1}. ${i>S.camp?'???':l.n}<small>${i<S.camp?'Пройдено':i>S.camp?'Сначала пройди предыдущую главу':'Текущая глава'}</small></button>`).join('')+'</div><button class="pb r" data-a=play>Назад</button>')},
chap(i){i=+i;mm(`<h1>Глава ${i+1}</h1><h2>${C[i].n}</h2><p>${C[i].intro}</p><p>Цель: победи ${C[i].kills} врагов, затем босса: ${C[i].boss.n}.</p><div class=gr><button class="pb g" data-a=go data-k=${i}>В бой</button><button class="pb r" data-a=camp>Назад</button></div>`)},
go(i){start('camp',+i)},
surv(){mm('<h1>Рекорд</h1><p>Выбери локацию. Чем дольше живёшь, тем злее враги.</p><div class=gr>'+C.map((l,i)=>`<button class="pb" data-a=sgo data-k=${i} ${i>S.camp?'disabled':''}>${i>S.camp?'Закрыто':l.n}<small>${i>S.camp?'Открывается в кампании':'Лучшее время: '+(S.rec[i]||0)+' с.'}</small></button>`).join('')+'</div><button class="pb r" data-a=play>Назад</button>')},
sgo(i){start('surv',+i)},
shop(){SH.sel=SH.tab==='h'?'h:'+S.hero:SH.sel;shop()},
tab(k){SH.tab=k;SH.sel={h:'h:'+S.hero,w:'w:'+S.wp[S.hero],u:'u:d',a:'a:magnet'}[k];shop()},
sel(k){SH.sel=k;shop()},
do(k){const [t,id]=k.split(':');let ok=0;
if(t==='h'){const o=H_[id];if(S.heroes[id])S.hero=id;else if(S.coins>=o.cost){S.coins-=o.cost;S.heroes[id]=1;S.hero=id;ok=1}}
else if(t==='w'){const o=WP[id];if(S.wps[id])S.wp[o.hero]=id;else if(S.heroes[o.hero]&&S.coins>=o.cost){S.coins-=o.cost;S.wps[id]=1;S.wp[o.hero]=id;ok=1}}
else if(t==='u'){const l=S.up[id],p=10+15*l;if(l<8&&S.coins>=p){S.coins-=p;S.up[id]++;ok=1}}
else{const o=A[id];if(S.ams[id])S.am=S.am===id?null:id;else if(S.coins>=o.cost){S.coins-=o.cost;S.ams[id]=1;S.am=id;ok=1}}
if(ok)sfx('buy');save();shop()},
egg(){eggs++;if(eggs===5){eggs=0;document.querySelector('#tt').innerHTML='ХОНК!';if(!S.egg){S.egg=1;S.coins+=5;save()}}}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b&&!b.disabled){ac();sfx('click');act[b.dataset.a](b.dataset.k)}});
addEventListener('pointerdown',()=>{ac();if(AC&&!mt&&!g)music(3)});
addEventListener('keydown',e=>{keys[e.code]=1;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()});addEventListener('keyup',e=>keys[e.code]=0);
function hold(el,k,fn){el.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=1;if(fn)fn()});for(const ev of ['pointerup','pointerleave','pointercancel'])el.addEventListener(ev,()=>keys[k]=0);el.addEventListener('contextmenu',e=>e.preventDefault())}
hold(document.querySelector('#bj'),'j',()=>{if(S.set.vib&&navigator.vibrate)navigator.vibrate(8)});hold(document.querySelector('#bat'),'a');
dp.querySelectorAll('button').forEach(b=>hold(b,b.dataset.d));
let jd=0;function jm(e){const r=joy.getBoundingClientRect(),rd=r.width/2;let dx=(e.clientX-r.left-rd)/rd,dy=(e.clientY-r.top-rd)/rd;const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}kn.style.transform=`translate(${dx*rd*.5}px,${dy*rd*.5}px)`;IN.mx=Math.abs(dx)<.25?0:dx;IN.my=dy}
joy.addEventListener('pointerdown',e=>{e.preventDefault();jd=1;joy.setPointerCapture(e.pointerId);jm(e)});joy.addEventListener('pointermove',e=>{if(jd)jm(e)});
for(const ev of ['pointerup','pointercancel'])joy.addEventListener(ev,()=>{jd=0;IN.mx=IN.my=0;kn.style.transform=''});
function rs(){const st=document.querySelector('#stage'),cs=getComputedStyle(st),sw=st.clientWidth-(parseFloat(cs.paddingLeft)||0)-(parseFloat(cs.paddingRight)||0),sh=st.clientHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0),s=Math.min(sw/W,sh/H);box.style.width=Math.floor(W*s)+'px';box.style.height=Math.floor(H*s)+'px'}
addEventListener('resize',rs);rs();act.home();requestAnimationFrame(n=>{last=n;loop(n)});
</script></body></html>
