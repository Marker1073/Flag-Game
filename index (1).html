.sc{font-size:34px;font-weight:700;color:var(--tx);letter-spacing:-.02em}
.hp{font-size:20px;letter-spacing:3px}

.item b{flex:1}.item button{padding:8px 14px;border-radius:12px;box-shadow:none;font-size:14px}

button.ok{animation:pulse .35s}

return `<div class="grid">${seg([["1",t().on],["0",t().off]],c.on?"1":"0","cuOn")}${inp("bg1",t().cBg1)}${inp("bg2",t().cBg2)}${inp("ac",t().cAc)}${inp("tx",t().cTx)}${inp("card",t().cCard)}${rng("ang",t().cAng,0,360,c.ang,"+this.value")}${rng("ca",t().cAlpha,0,100,c.ca*100,"this.value/100")}${rng("pitch",t().cPitch,60,160,c.pitch*100,"this.value/100")}<div class="row"><b>${t().cHeart}</b><input type="text" maxlength="4" value="${esc(c.heart)}" oninput="cuSet('heart',this.value)" style="width:70px;padding:6px;flex:none"></div><button onclick="cuReset()">${t().cReset}</button></div>`}
function cuOn(k){st.cu.on=k==="1";save();applySkin();shop()}
function cuSet(k,v){st.cu[k]=v;st.cu.on=true;save();applySkin()}
function cuReset(){Object.assign(st.cu,{bg1:"#1e1e2e",bg2:"#3a1c71",ac:"#ffffff",tx:"#ffffff",card:"#000000",ca:.25,ang:160,heart:"❤️",pitch:1});save();applySkin();shop()}
const OWNER_EMAIL="markghambaryan59@gmail.com";
const isOwner=()=>!!(F&&OWNER_EMAIL&&F.auth.currentUser&&F.auth.currentUser.email===OWNER_EMAIL);
let betaList=[];
async function loadBeta(){const el=document.getElementById("bt");if(!el)return;if(F){try{const d=await F.fs.getDoc(F.fs.doc(F.store,"meta","beta"));betaList=d.exists()?(d.data().names||[]):[]}catch(e){betaList=[]}}drawBeta()}
function drawBeta(){const el=document.getElementById("bt");if(!el)return;const o=isOwner();
el.innerHTML=(betaList.length?betaList.map((n,i)=>`<div class="row"><b>${esc(n)}</b>${o?`<button class="ic" onclick="betaDel(${i})">✕</button>`:""}</div>`).join(""):`<p class="s">${t().betaNone}</p>`)+(o?`<input id="bn" maxlength="14" placeholder="${esc(t().betaAdd)}" autocomplete="off"><button class="big" onclick="betaAdd()"><span>${t().betaAdd}</span></button>`:"")}
async function betaSave(){try{await F.fs.setDoc(F.fs.doc(F.store,"meta","beta"),{names:betaList})}catch(e){toast(t().authErr)}drawBeta()}
function betaAdd(){const v=document.getElementById("bn").value.trim().slice(0,14);if(!v||betaList.includes(v))return;betaList.push(v);betaSave()}
function drawCheats(){const el=document.getElementById("dc");if(!el)return;
el.innerHTML=`<div class="lab">${t().cheat}</div>
<div class="row"><input id="cr" type="number" value="100" style="flex:1;min-width:0"><button onclick="devRub()">◆ +</button></div>
<div class="row"><select id="cm"><option value="1">${t().m1}</option><option value="2">${t().m2}</option></select><select id="cl">${lvItems().map(([k,v])=>`<option value="${k}">${v}</option>`).join("")}</select></div>
<div class="row"><input id="cs" type="number" value="100" style="flex:1;min-width:0"><button onclick="devRec()">${t().setRec}</button></div>
<button onclick="devSkins()">${t().unlockAll}</button>`}
function devRub(){if(!isOwner())return;const n=parseInt(document.getElementById("cr").value)||0;st.rub=Math.max(0,st.rub+n);save();toast("◆ "+st.rub)}
function devRec(){if(!isOwner())return;const m=document.getElementById("cm").value,l=document.getElementById("cl").value,n=Math.max(0,parseInt(document.getElementById("cs").value)||0);st.best[m+l]=n;save();push();toast(t().lv[l]+" · "+n)}
function devSkins(){if(!isOwner())return;st.own=ITEMS.map(x=>x.id);save();toast("✓")}
function betaDel(i){betaList.splice(i,1);betaSave()}
function ping(){if(st.guest||!F||!uid||!st.nick)return;try{F.fs.setDoc(F.fs.doc(F.store,"players",uid),{name:st.nick,seen:Date.now()}).catch(()=>{})}catch(e){}}
function ago(ms){const m=ms/6e4|0;if(m<1)return t().now;if(m<60)return m+" "+t().min;const h=m/60|0;return h<24?h+" "+t().hr:(h/24|0)+" "+t().day}
async function loadDev(){const el=document.getElementById("dv");if(!el)return;
try{const q=await F.fs.getDocs(F.fs.query(F.fs.collection(F.store,"players"),F.fs.orderBy("seen","desc"),F.fs.limit(500)));
const rows=q.docs.map(d=>d.data()),now=Date.now(),act=rows.filter(r=>now-r.seen<=6048e5),ina=rows.filter(r=>now-r.seen>6048e5);
const li=a=>a.length?a.map(r=>`<div class="row"><b>${esc(r.name||"?")}</b><span class="s">${ago(now-r.seen)}</span></div>`).join(""):`<p class="s">—</p>`;
el.innerHTML=`<p class="s">${t().total}: ${rows.length} · ${t().active}: ${act.length} · ${t().inactive}: ${ina.length}</p><div class="lab">${t().active}</div>${li(act)}<div class="lab">${t().inactive}</div>${li(ina)}`}
catch(e){el.innerHTML=`<p class="s">${t().fail}</p>`}}
function end(){scr="x";ping();
const rec=record();if(rec&&score>0){sRec();burst(innerWidth/2,innerHeight/3,40,true)}else sEnd();
$.innerHTML=`<h1>${t().over}</h1><div class="res">${score}</div><p class="s">${t().lv[st.lv]} · ${t()["m"+mode]}</p>
${rec&&score>0?`<p class="new">${t().newRec}</p>`:`<p class="s">${t().best}: ${bk(mode,st.lv)}</p>`}
<button class="big" onclick="start(mode)"><span>${t().again}</span></button><button onclick="board()">${t().board}</button><button onclick="home()">${t().menu}</button>`}
$.addEventListener("click",e=>{const b=e.target.closest("button");if(b&&!b.closest(".f1,.f2"))sClick()});
initFb();home();
</script></body></html>
